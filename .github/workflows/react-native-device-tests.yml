name: React Native device tests
# Advisory during rollout: keep this check out of required status checks.
# Failures remain visible. No merge, publication, or scheduled trigger.
on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize]

permissions: {}

concurrency:
  group: rn-device-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: React Native device tests
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      pull-requests: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # Classify inside the workflow so release PRs always run, and a new push
      # still cancels the previous caller even when it removes relevant changes.
      - name: Select SDK, dependency, build, and release changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)' > changed-files.txt
          python3 - <<'PY'
          import fnmatch
          import json
          import os
          from pathlib import Path

          pr = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())['pull_request']
          release = pr['head']['ref'].startswith(('release-please--', 'release/', 'hotfix-release/'))
          patterns = (
              'libs/*', 'apps/*', 'scripts/*', 'tools/*', 'patches/*',
              'package.json', 'package-lock.json', 'npm-shrinkwrap.json',
              'yarn.lock', 'pnpm-lock.yaml', '.npmrc', '.yarnrc*', '.nvmrc',
              '.node-version', '.ruby-version', 'Gemfile*', 'nx.json',
              'tsconfig*.json', 'babel.config.*', 'metro.config.*',
              'react-native.config.*', '.github/workflows/react-native-device-tests.yml',
          )

          def relevant(path):
              if path.endswith(('.md', '.mdx', '.rst')) or 'docs' in Path(path).parts[:-1]:
                  return False
              return any(fnmatch.fnmatchcase(path, pattern) for pattern in patterns)

          # The files API stops at 3,000 files. Run rather than skip an incomplete diff.
          selected = release or pr['changed_files'] >= 3000 or any(
              relevant(path) for path in Path('changed-files.txt').read_text().splitlines())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"run={str(selected).lower()}\n")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Device suite selected.\n' if selected else
                            'Device suite skipped: no SDK, dependency, build, or release changes.\n')
          PY

      - name: Get token for the mobile test workflow
        id: token
        if: steps.changes.outputs.run == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          owner: rudderlabs
          repositories: rudder-mobile-sdk-test
          permission-actions: write

      - name: Start both device tests
        id: dispatch
        if: steps.changes.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RIG: rudderlabs/rudder-mobile-sdk-test
        run: |
          run_id=$(gh api --method POST "repos/$RIG/actions/workflows/react-native-pr.yaml/dispatches" \
            -f ref=main -F return_run_details=true -f "inputs[sdk_ref]=$HEAD_SHA" \
            -f "inputs[pr_number]=$PR_NUMBER" --jq '.workflow_run_id')
          [[ "$run_id" =~ ^[0-9]+$ ]]
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "[Device test run](https://github.com/$RIG/actions/runs/$run_id)" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for the device result
        if: steps.dispatch.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          RIG: rudderlabs/rudder-mobile-sdk-test
        run: |
          cancel_remote() {
            gh api --method POST "repos/$RIG/actions/runs/$RUN_ID/cancel" || true
            exit 1
          }
          trap cancel_remote SIGINT SIGTERM
          while true; do
            verdict=$(gh api "repos/$RIG/actions/runs/$RUN_ID" --jq 'if .status == "completed" then .conclusion else "waiting" end')
            case "$verdict" in
              success) exit 0 ;;
              waiting) sleep 20 & wait $! ;;
              *) echo "::error::Device tests ended with $verdict"; exit 1 ;;
            esac
          done

      # Covers cancellation outside the wait step as well as a superseding push
      # whose new diff no longer selects the device suite.
      - name: Cancel the remote run when this caller is cancelled
        if: cancelled() && steps.dispatch.outputs.run_id != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          RIG: rudderlabs/rudder-mobile-sdk-test
        run: gh api --method POST "repos/$RIG/actions/runs/$RUN_ID/cancel"
