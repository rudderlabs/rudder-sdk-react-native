# The React Native SDK intentionally keeps a two-branch release model:
# develop is the integration branch and master is the release branch.
#
# This workflow promotes a develop/hotfix snapshot to master without changing
# package versions. release-please owns versioning, changelogs, package tags,
# the monorepo tag, and GitHub Releases after the promotion PR is merged.

name: Promote Release Candidate

on: workflow_dispatch

permissions:
  contents: read

jobs:
  promote-release-candidate:
    name: Promote release candidate to master
    runs-on: ubuntu-latest
    environment: release
    if: startsWith(github.ref, 'refs/heads/develop') || startsWith(github.ref, 'refs/heads/hotfix/')
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout source branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate releasable changes
        run: |
          git fetch --no-tags origin master

          if ! git merge-base --is-ancestor origin/master HEAD; then
            echo "The source branch does not contain the latest master release."
            echo "Back-merge master before promoting this release candidate."
            exit 1
          fi

          commit_count=$(git rev-list --count origin/master..HEAD)
          if [[ "$commit_count" -eq 0 ]]; then
            echo "No commits are available to promote from ${GITHUB_REF_NAME} to master."
            exit 1
          fi

          echo "Promoting $commit_count commit(s) from ${GITHUB_REF_NAME} to master."

      - name: Create promotion branch
        id: promotion
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          branch_type=release
          if [[ "$GITHUB_REF_NAME" == hotfix/* ]]; then
            branch_type=hotfix
          fi

          branch_name="${branch_type}/candidate-${GITHUB_RUN_ID}"
          source_sha=$(git rev-parse HEAD)

          existing_sha=$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch_name}" \
            --jq '.object.sha' 2>/dev/null || true)

          if [[ -n "$existing_sha" && "$existing_sha" != "$source_sha" ]]; then
            echo "Promotion branch $branch_name exists at an unexpected commit."
            exit 1
          fi

          if [[ -z "$existing_sha" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
              --method POST \
              -f ref="refs/heads/${branch_name}" \
              -f sha="$source_sha"
          fi

          echo "branch_name=$branch_name" >> "$GITHUB_OUTPUT"

      - name: Create promotion pull request
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          BRANCH_NAME: ${{ steps.promotion.outputs.branch_name }}
        run: |
          existing_pr=$(gh pr list \
            --base master \
            --head "$BRANCH_NAME" \
            --state open \
            --json url \
            --jq '.[0].url // empty')

          if [[ -n "$existing_pr" ]]; then
            echo "Promotion pull request already exists: $existing_pr"
            exit 0
          fi

          gh pr create \
            --base master \
            --head "$BRANCH_NAME" \
            --title "chore(release): promote ${GITHUB_REF_NAME} to master" \
            --body "Promotes the releasable state from \`${GITHUB_REF_NAME}\` to \`master\`. After merge, release-please will create or update the monorepo release PR."
