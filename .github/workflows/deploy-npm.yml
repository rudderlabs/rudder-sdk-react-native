name: Deploy to NPM

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  deploy-npm:
    name: Deploy to NPM
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag $RELEASE_TAG is not a valid monorepo release tag."
            exit 1
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # Release jobs must not restore mutable dependency state from previous runs.
          # See https://docs.zizmor.sh/audits/#cache-poisoning and https://github.com/actions/setup-node#caching-global-packages-data
          package-manager-cache: false

      - name: Install node_modules
        env:
          HUSKY: 0
        run: |
          npm run setup:ci

      - name: Resolve release range
        id: range
        env:
          CURRENT_TAG: ${{ steps.release.outputs.tag }}
        run: |
          previous_tag=$(git tag -l "v*" --sort=-version:refname |
            grep -Fxv "$CURRENT_TAG" |
            head -n 1)

          if [[ -z "$previous_tag" ]]; then
            echo "Unable to find the previous monorepo release tag."
            exit 1
          fi

          echo "current=$CURRENT_TAG" >> "$GITHUB_OUTPUT"
          echo "previous=$previous_tag" >> "$GITHUB_OUTPUT"
          echo "Publishing packages changed between $previous_tag and $CURRENT_TAG."

      - name: Build and publish changed packages
        env:
          CURRENT_TAG: ${{ steps.range.outputs.current }}
          PREVIOUS_TAG: ${{ steps.range.outputs.previous }}
        run: |
          while IFS= read -r project; do
            package_json="$(dirname "$project")/package.json"
            previous_version=$(git show "$PREVIOUS_TAG:$package_json" 2>/dev/null |
              jq -r '.version // empty' || true)
            current_version=$(jq -r '.version' "$package_json")

            if [[ "$previous_version" == "$current_version" ]]; then
              echo "Skipping $package_json; version remains $current_version."
              continue
            fi

            name=$(node -p "require('./$package_json').name")
            project_name=$(jq -r '.name' "$project")

            if npm view "$name@$current_version" version >/dev/null 2>&1; then
              echo "$name@$current_version is already live on npm; skipping."
              continue
            fi

            echo "Publishing $name from $previous_version to $current_version."
            npx nx run "$project_name:deploy"
          done < <(grep -rl '"deploy"' --include=project.json libs | sort)

      - name: Verify changed package versions on npm
        env:
          PREVIOUS_TAG: ${{ steps.range.outputs.previous }}
        run: |
          failed=0
          while IFS= read -r project; do
            package_json="$(dirname "$project")/package.json"
            previous_version=$(git show "$PREVIOUS_TAG:$package_json" 2>/dev/null |
              jq -r '.version // empty' || true)
            current_version=$(jq -r '.version' "$package_json")

            if [[ "$previous_version" == "$current_version" ]]; then
              continue
            fi

            name=$(node -p "require('./$package_json').name")
            if npm view "$name@$current_version" version >/dev/null 2>&1; then
              echo "$name@$current_version is live on npm."
            else
              echo "$name@$current_version is not live on npm."
              failed=1
            fi
          done < <(grep -rl '"deploy"' --include=project.json libs | sort)

          exit "$failed"

      - name: Send message to Slack channel
        continue-on-error: true
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        env:
          PROJECT_NAME: React Native SDK npm packages
          NPM_PACKAGE_URL: https://www.npmjs.com/search?q=%40rudderstack
          VERSION: ${{ steps.range.outputs.current }}
        with:
          method: chat.postMessage
          payload-templated: true
          retries: rapid
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_RELEASE_CHANNEL_ID }}",
              "text": "New release: ${{ env.PROJECT_NAME }} ${{ env.VERSION }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🚀 *${{ env.PROJECT_NAME }}* published for ${{ env.VERSION }}.\n*Packages:* ${{ env.NPM_PACKAGE_URL }}"
                  }
                }
              ]
            }
