name: Deploy to NPM

on:
  workflow_dispatch:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ['Publish new github release']
    types:
      - completed

permissions:
  id-token: write
  contents: read

jobs:
  deploy-npm:
    name: Deploy to NPM
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/master') || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout source branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Checkout to master
        if: github.event.workflow_run.conclusion == 'success'
        run: git checkout master

      - name: Setup Node
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install node_modules
        env:
          HUSKY: 0
        run: |
          rm -rf node_modules
          npm run setup:ci

      - name: Get the two latest versions
        id: get-versions
        run: |
          CURRENT_VERSION=$(git tag -l "v*" --sort=-version:refname | head -n 1)
          LAST_VERSION=$(git tag -l "v*" --sort=-version:refname | head -n 2 | awk 'NR == 2 { print $1 }')

          echo "Current version: $CURRENT_VERSION"
          echo "Previous version: $LAST_VERSION"

          echo "current_version=$(echo $CURRENT_VERSION)" >> "$GITHUB_OUTPUT"
          echo "last_version=$(echo $LAST_VERSION)" >> "$GITHUB_OUTPUT"
          echo "DATE=$(date)" >> "$GITHUB_OUTPUT"

      # continue-on-error: on a partial release, changelog regeneration marks
      # unchanged packages as nx-affected; their `npm publish` is rejected with
      # "cannot publish over previously published version". Those rejections are
      # expected — the verify step below catches genuine publish failures.
      - name: Build & Publish affected packages
        continue-on-error: true
        env:
          current_version: ${{ steps.get-versions.outputs.current_version }}
          last_version: ${{ steps.get-versions.outputs.last_version }}
        run: |
          npm run deploy:npm -- --base=$last_version --head=$current_version

      # Every package with a deploy target must have its package.json version live
      # on npm: unchanged packages resolve to their old (published) version, bumped
      # packages to the new one — so a genuine publish failure fails the job here.
      - name: Verify published versions on npm
        run: |
          FAILED=0
          for proj in $(grep -rl '"deploy"' --include=project.json libs); do
            pkg="$(dirname "$proj")/package.json"
            NAME=$(node -p "require('./$pkg').name")
            VERSION=$(node -p "require('./$pkg').version")
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "✅ $NAME@$VERSION is live on npm"
            else
              echo "❌ $NAME@$VERSION is NOT on npm"
              FAILED=1
            fi
          done
          exit $FAILED

      - name: Send message to Slack channel
        id: slack
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a  #v2.1.1
        env:
          PROJECT_NAME: 'React Native SDK npm packages'
          NPM_PACKAGE_URL: 'https://www.npmjs.com/search?q=%40rudderstack'
          DATE: ${{ steps.get-versions.outputs.DATE }}
          current_version: ${{ steps.get-versions.outputs.current_version }}
        with:
          method: chat.postMessage
          payload-templated: true
          retries: rapid
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_RELEASE_CHANNEL_ID }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "New release: ${{ env.PROJECT_NAME }}"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Release: <${{ env.NPM_PACKAGE_URL }}|Latest Packages>*\n${{ env.DATE }}"
                  }
                }
              ]
            }
