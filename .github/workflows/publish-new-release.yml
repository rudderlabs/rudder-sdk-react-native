# release-please creates package tags, the v-prefixed monorepo tag, and GitHub
# Releases from master. This workflow sends the repository-specific
# notification once the monorepo release is published.

name: Post Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify-release:
    name: Notify release
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Send message to Slack channel
        continue-on-error: true
        uses: slackapi/slack-github-action@485a9d42d3a73031f12ec201c457e2162c45d02d # v2.0.0
        env:
          PROJECT_NAME: React Native SDK monorepo
          RELEASE_URL: ${{ github.event.release.html_url }}
          VERSION: ${{ github.event.release.tag_name }}
        with:
          method: chat.postMessage
          payload-templated: true
          retries: rapid
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_RELEASE_CHANNEL_ID }}",
              "text": "New release: ${{ env.PROJECT_NAME }} ${{ env.VERSION }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🚀 *${{ env.PROJECT_NAME }} ${{ env.VERSION }}* has been released.\n*Release:* ${{ env.RELEASE_URL }}"
                  }
                }
              ]
            }
