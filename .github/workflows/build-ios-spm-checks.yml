name: Check iOS SPM Build

on:
  pull_request:
    branches: ['master']
    types: ['opened', 'reopened', 'synchronize']

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Check iOS SPM Build
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read # actions/checkout reads the repository

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install node_modules
        env:
          HUSKY: 0
        run: npm ci --no-audit --no-fund

      - name: Build and pack the SDK and integrations
        run: |
          projects=rudder-sdk-react-native
          for name in amplitude appcenter appsflyer braze clevertap facebook firebase moengage singular sprig; do
            projects="${projects},rudder-integration-${name}-react-native"
          done
          npx nx run-many -t build -p "$projects"
          mkdir -p "$RUNNER_TEMP/tarballs"
          for dir in dist/libs/*/; do
            (cd "$dir" && npm pack --pack-destination "$RUNNER_TEMP/tarballs")
          done
          ls "$RUNNER_TEMP/tarballs"

      - name: Xcode version
        run: xcodebuild -version

      - name: Build a fresh app with Swift Package Manager
        run: scripts/ios-spm-check/run.sh "$RUNNER_TEMP/tarballs" "$RUNNER_TEMP/spm-app"
