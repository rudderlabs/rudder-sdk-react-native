version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    groups:
      npm-prod-deps:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
        dependency-type: "production"

      npm-dev-deps:
        applies-to: version-updates
        patterns:
          - "*"
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

      npm-prod-major-deps:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
        dependency-type: "production"

      npm-dev-major-deps:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
        dependency-type: "development"

  - package-ecosystem: "npm"
    directory: "/apps/example"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7

  - package-ecosystem: "npm"
    directory: "/apps/expo-example"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7

  # Security updates remain separate; version update PRs are paused above.
